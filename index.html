<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>Cifras</title>
<style>
  :root{
    --bg:#111418; --bg2:#1a1f26; --fg:#e7ebf0; --muted:#8a93a0;
    --accent:#ffcc55; --chord:#ffcc55; --line:#262d36;
    --lyric-size:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  /* ---------- LISTA ---------- */
  #lista{padding:14px 14px 60px;}
  h1{font-size:22px; margin:8px 4px 14px;}
  .item{display:flex; align-items:center; gap:10px; padding:14px;
    background:var(--bg2); border-radius:14px; margin-bottom:8px; cursor:pointer;
    touch-action:pan-y; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;}
  .item:active{background:#222831;}
  .item-info{flex:1; min-width:0;}
  .item .t{font-size:17px; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .item .a{font-size:13px; color:var(--muted);}
  .item .flag{font-size:16px; flex-shrink:0;}
  .item .fav{background:none; border:none; font-size:22px; line-height:1;
    color:#5a6472; padding:4px 2px; flex-shrink:0;}
  .item .fav.on{color:var(--accent);}
  .item.arrastando{background:#2c343f; box-shadow:0 10px 28px rgba(0,0,0,.55);
    transform:scale(1.03); position:relative; z-index:5;}
  /* ---------- CIFRA ---------- */
  /* tela da cifra = coluna de altura cheia; só o miolo (.corpo) rola.
     Evita barra fixa, que no iOS some durante a rolagem com inércia. */
  #cifra{display:none; flex-direction:column;
    height:100vh; height:100dvh;}
  .topo{flex-shrink:0; background:var(--bg);
    border-bottom:1px solid var(--line); padding:10px 12px;
    display:flex; align-items:center; gap:10px;}
  .voltar{background:var(--bg2); border:none; color:var(--fg);
    font-size:18px; width:42px; height:42px; border-radius:12px;}
  .titulo{flex:1; min-width:0;}
  .titulo .t{font-size:17px; font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .titulo .a{font-size:12px; color:var(--muted);}
  .tom{font-size:13px; color:var(--accent); padding:6px 10px; cursor:pointer;
    background:var(--bg2); border-radius:8px; white-space:nowrap;}
  /* seletor de tom (popover) */
  .tom-overlay{position:fixed; inset:0; z-index:50; display:flex;
    justify-content:flex-end; align-items:flex-start; padding:60px 12px 0;}
  .tom-overlay.oculto{display:none;}
  .tom-card{background:var(--bg2); border:1px solid var(--line);
    border-radius:16px; padding:12px; width:300px; max-width:92vw;
    box-shadow:0 16px 40px rgba(0,0,0,.6);}
  .tp-row{display:flex; gap:8px; margin-bottom:10px;}
  .tp-row .tp-btn{flex:1; height:48px; border:none; border-radius:12px;
    background:var(--bg); color:var(--fg); font-size:15px;}
  .tp-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
    margin-bottom:10px;}
  .tp-note{height:52px; border:none; border-radius:12px; background:var(--bg);
    color:var(--fg); font-size:17px; font-weight:600;}
  .tp-note.on{background:var(--accent); color:#111;}
  .tp-reset{width:100%; height:48px; border:none; border-radius:12px;
    background:var(--bg); color:var(--muted); font-size:15px;}
  .tp-btn:active,.tp-note:active,.tp-reset:active{filter:brightness(1.4);}
  .tom-btn{font-size:17px; height:36px; min-width:44px; border:none;
    border-radius:8px; background:var(--bg2); color:var(--muted);}
  .tom-btn.on{background:var(--accent); color:#111;}
  .corpo{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px 12px 24px; overscroll-behavior:contain;}
  /* linhas de cifra: cada palavra carrega o acorde em cima */
  .linha{display:flex; flex-wrap:wrap; align-items:flex-end;
    line-height:1.3; margin-bottom:9px; min-height:1.15em; row-gap:7px;}
  .linha.vazia{min-height:0; height:18px; font-size:0; margin-bottom:0; row-gap:0;} /* separação entre blocos */
  .pal{display:inline-flex; flex-direction:column; white-space:pre;
    font-size:var(--lyric-size);}
  .pal .ac{color:var(--chord); font-weight:700; font-size:.78em;
    height:1em; line-height:1em; font-family:ui-monospace,Menlo,monospace;
    padding-right:8px;}                 /* acorde mais perto da sílaba */
  .pal .ac:empty{padding-right:0;}      /* slot vazio não alarga o texto */
  /* modo só-letra: esconde os acordes e some com as linhas só-de-acordes */
  .corpo.so-letra .ac{display:none;}
  .corpo.so-letra .linha.acordes-only{display:none;}
  /* botão de modo (Cifra / Letra / Solo) */
  .modo-btn{font-size:13px; font-weight:700; height:36px; padding:0 12px;
    min-width:62px; border:none; border-radius:8px; background:var(--bg2); color:var(--fg);}
  .modo-btn.modo-solo{background:var(--accent); color:#111;}
  /* tab de solo (monoespaçado, rola na horizontal) */
  .tab{font-family:ui-monospace,Menlo,monospace; white-space:pre; overflow-x:auto;
    font-size:13px; line-height:1.4; color:var(--fg); margin:0;
    -webkit-overflow-scrolling:touch;}
  .secao-musica{color:var(--accent); font-weight:700; margin:26px 0 9px;
    font-size:14px; letter-spacing:.05em;}
  .secao-musica:first-child{margin-top:4px;}
  .vazio{color:var(--muted); font-style:italic; padding:30px 6px; line-height:1.6;}
  .vazio code{background:var(--bg2); padding:2px 6px; border-radius:6px;
    color:var(--accent); font-style:normal;}
  /* ---------- BARRA INFERIOR ---------- */
  .barra{flex-shrink:0; background:var(--bg2);
    border-top:1px solid var(--line); padding:10px 12px;
    display:none;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  .barra-view{display:flex; gap:8px; align-items:center; width:100%;}
  .barra-view.oculto{display:none;}
  /* vista principal: 40% (2 botões) + 60% (botão grande) */
  #bvMain .lado-esq{display:flex; gap:8px; width:40%;}
  #bvMain .lado-esq .btn-mini{flex:1;}
  .btn-grande{width:60%; height:56px; background:var(--accent); color:#111;
    border:none; border-radius:16px; font-size:30px; font-weight:700;}
  .btn-grande:active{filter:brightness(.9);}
  .btn-mini{background:var(--bg2); border:none; color:var(--fg);
    height:56px; min-width:52px; border-radius:14px; font-size:24px;}
  .btn-mini:active{background:#2a313b;}
  .btn{background:var(--bg2); border:none; color:var(--fg);
    font-size:18px; height:48px; min-width:48px; border-radius:12px; padding:0 12px;}
  .btn:active{background:#2a313b;}
  .btn.on{background:var(--accent); color:#111;}
  .ctrl{display:flex; align-items:center; gap:6px;}
  .ctrl-lbl{font-size:11px; color:var(--muted); min-width:32px; text-align:center;}
  .vel-num{font-size:22px; font-weight:700; color:var(--accent);
    min-width:38px; text-align:center;}
  .empurra{margin-left:auto;}
  .btn-salvar{background:var(--accent); color:#111;}
  /* ---------- HOME: cabeçalho com botão Afinador ---------- */
  .home-top{display:flex; align-items:center; gap:10px; margin:8px 4px 14px;}
  .home-top h1{margin:0; flex:1;}
  .afinador-btn{background:var(--bg2); border:1px solid var(--line); color:var(--fg);
    font-size:14px; font-weight:600; padding:10px 14px; border-radius:12px;
    white-space:nowrap;}
  .afinador-btn:active{background:#2a313b;}
  /* ---------- TELA AFINADOR ---------- */
  #afinador{display:none; flex-direction:column; height:100vh; height:100dvh;}
  .af-corpo{flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:safe center; gap:16px; padding:20px; overflow-y:auto;}
  .af-nota{font-size:88px; font-weight:800; line-height:1; color:var(--muted);
    min-height:96px;}
  .af-nota.afinado{color:#46d27a;}
  .af-nota.baixo,.af-nota.alto{color:var(--fg);}
  .af-dir{font-size:22px; font-weight:800; min-height:28px; letter-spacing:.02em;}
  .af-dir.baixo{color:#ffcc55;} .af-dir.alto{color:#ff8b6b;} .af-dir.ok{color:#46d27a;}
  .af-hz{font-size:15px; color:var(--muted);}
  .meter{width:100%; max-width:420px;}
  .meter-escala{display:flex; justify-content:space-between;
    font-size:11px; color:var(--muted); margin-bottom:4px;}
  .meter-trilho{position:relative; height:54px; background:var(--bg2);
    border-radius:12px; overflow:hidden;}
  .meter-zero{position:absolute; left:50%; top:6px; bottom:6px; width:2px;
    margin-left:-1px; background:#46d27a; opacity:.6;}
  .meter-needle{position:absolute; top:4px; bottom:4px; width:6px; left:50%;
    margin-left:-3px; border-radius:3px; background:var(--accent);
    transition:left .07s linear, background .1s;}
  .meter-needle.afinado{background:#46d27a;}
  .af-cordas{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .af-corda{width:46px; height:46px; border-radius:12px; background:var(--bg2);
    border:1px solid var(--line); color:var(--fg); font-size:18px; font-weight:700;
    display:flex; align-items:center; justify-content:center;}
  .af-corda{cursor:pointer;}
  .af-corda.ativa{background:var(--accent); color:#111; border-color:var(--accent);}
  .af-corda.sel{border-color:var(--accent); border-width:2px; color:var(--accent);}
  .af-corda.sel.ativa{color:#111;}
  .af-corda.afinado{background:#46d27a; color:#111; border-color:#46d27a;}
  .af-tuning{display:flex; gap:10px; align-items:center;}
  .af-tuning button{background:var(--bg2); border:1px solid var(--line); color:var(--fg);
    height:40px; min-width:48px; border-radius:10px; font-size:15px; font-weight:600;}
  .af-tuning .lbl{font-size:13px; color:var(--muted); min-width:120px; text-align:center;}
  .af-cfg-btn{background:none; border:1px solid var(--line); color:var(--muted);
    font-size:13px; height:34px; padding:0 14px; border-radius:10px;}
  .af-ajustes{width:100%; max-width:360px; background:var(--bg2);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; flex-direction:column; gap:10px;}
  .af-ajustes.oculto{display:none;}
  .aj-row{display:flex; align-items:center; gap:8px; font-size:14px;}
  .aj-row > span:first-child{flex:1; color:var(--fg);}
  .aj-row button{background:var(--bg); border:none; color:var(--fg); width:38px;
    height:38px; border-radius:10px; font-size:18px;}
  .aj-val{min-width:54px; text-align:center; color:var(--accent); font-weight:700;}
  .aj-acoes{display:flex; gap:8px; margin-top:2px;}
  .aj-acoes button{flex:1; height:42px; border:none; border-radius:10px;
    background:var(--bg); color:var(--fg); font-size:14px;}
  .aj-acoes .aj-salvar{background:var(--accent); color:#111; font-weight:700;}
  .af-start{background:var(--accent); color:#111; border:none; border-radius:14px;
    height:54px; padding:0 22px; font-size:17px; font-weight:700;}
  .af-status{font-size:13px; color:var(--muted); text-align:center; min-height:18px;}
  /* ---------- diagrama de acorde (popover) ---------- */
  .ac{cursor:pointer;}
  .acorde-overlay{position:fixed; inset:0; z-index:60; display:flex;
    align-items:center; justify-content:center; padding:20px;}
  .acorde-overlay.oculto{display:none;}
  .acorde-card{background:var(--bg2); border:1px solid var(--line); border-radius:18px;
    padding:14px 18px 16px; width:230px; max-width:86vw;
    box-shadow:0 16px 44px rgba(0,0,0,.6); text-align:center;}
  .acorde-nome{font-size:26px; font-weight:800; color:var(--fg); margin-bottom:2px;}
  .acorde-svg{display:block; margin:6px auto 12px;}
  .acorde-var{background:var(--bg); border:1px solid var(--line); color:var(--fg);
    font-size:14px; height:44px; border-radius:12px; width:100%;}
  .acorde-var:active{background:#2a313b;}
  .acorde-som{background:var(--accent); color:#111; font-weight:700; border:none;
    margin-bottom:8px;}
  .acorde-som:active{filter:brightness(.9); background:var(--accent);}
  /* ---------- controles de deslocamento do tab (modo Solo) ---------- */
  .tab-ctrl{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  .tab-ctrl button{background:var(--bg2); border:none; color:var(--fg); height:40px;
    min-width:40px; border-radius:10px; font-size:16px; padding:0 10px;}
  .tab-ctrl button:active{background:#2a313b;}
  .tab-ctrl .salvar{background:var(--accent); color:#111;}
  .tab-ctrl .lbl{font-size:13px; color:var(--muted); min-width:74px; text-align:center;}
</style>
</head>
<body>

<!-- ============ TELA: LISTA ============ -->
<div id="lista"></div>

<!-- ============ TELA: CIFRA ============ -->
<div id="cifra">
  <div class="topo">
    <button class="voltar" onclick="voltar()">‹</button>
    <div class="titulo"><div class="t" id="cTitulo"></div><div class="a" id="cArtista"></div></div>
    <div class="tom" id="cTom" onclick="toggleTomPop()"></div>
    <button class="modo-btn" id="btnModo" onclick="ciclarModo()" aria-label="Modo: cifra, letra ou solo">Cifra</button>
  </div>

  <!-- seletor de tom -->
  <div class="tom-overlay oculto" id="tomPop" onclick="fecharTomPop()">
    <div class="tom-card" onclick="event.stopPropagation()">
      <div class="tp-row">
        <button class="tp-btn" onclick="transpor(-1);montaTomGrid()">– ½ tom</button>
        <button class="tp-btn" onclick="transpor(1);montaTomGrid()">+ ½ tom</button>
      </div>
      <div class="tp-grid" id="tpGrid"></div>
      <button class="tp-reset" onclick="restaurarTom()">Restaurar tom inicial</button>
    </div>
  </div>
  <div class="corpo" id="cCorpo"></div>

  <!-- barra de controles (rodapé estático da coluna) -->
  <div class="barra" id="barra">

  <!-- vista principal -->
  <div class="barra-view" id="bvMain">
    <div class="lado-esq">
      <button class="btn-mini" onclick="abrirPainel('settings')" aria-label="Ajustes">⚙</button>
      <button class="btn-mini" onclick="abrirPainel('scroll')" aria-label="Rolagem automática">▶</button>
    </div>
    <button class="btn-grande" onclick="rolarBaixo()" aria-label="Descer a tela">▼</button>
  </div>

  <!-- vista: ajustes (tom + fonte) -->
  <div class="barra-view oculto" id="bvSettings">
    <button class="btn-mini" onclick="fecharPainel()" aria-label="Voltar">‹</button>
    <div class="ctrl">
      <button class="btn" onclick="transpor(-1)">♭</button>
      <span class="ctrl-lbl">tom</span>
      <button class="btn" onclick="transpor(1)">♯</button>
    </div>
    <div class="ctrl">
      <button class="btn" onclick="mudaFonte(-1)">A−</button>
      <span class="ctrl-lbl">fonte</span>
      <button class="btn" onclick="mudaFonte(1)">A+</button>
    </div>
    <button class="btn empurra" onclick="restaurarOriginais()" aria-label="Restaurar tom e fonte">↺</button>
  </div>

  <!-- vista: rolagem automática -->
  <div class="barra-view oculto" id="bvScroll">
    <button class="btn-mini" onclick="fecharPainel()" aria-label="Voltar">‹</button>
    <button class="btn" onclick="velScroll(-1)">−</button>
    <span class="vel-num" id="velNum">5</span>
    <button class="btn" onclick="velScroll(1)">+</button>
    <button class="btn" id="btnPlay" onclick="toggleScroll()" aria-label="Iniciar/parar">▶</button>
    <button class="btn btn-salvar empurra" id="btnSalvarVel" onclick="salvarVel()" aria-label="Salvar velocidade">💾</button>
  </div>

  </div>
</div>

<!-- ============ TELA: AFINADOR ============ -->
<div id="afinador">
  <div class="topo">
    <button class="voltar" onclick="voltarDoAfinador()">‹</button>
    <div class="titulo"><div class="t">Afinador</div><div class="a">violão · padrão E A D G B E</div></div>
  </div>
  <div class="af-corpo">
    <div class="af-nota" id="afNota">–</div>
    <div class="af-dir" id="afDir"></div>
    <div class="af-hz" id="afHz">&nbsp;</div>
    <div class="meter">
      <div class="meter-escala">
        <span>↑ aperte</span><span>0</span><span>afrouxe ↓</span>
      </div>
      <div class="meter-trilho">
        <div class="meter-zero"></div>
        <div class="meter-needle" id="afNeedle"></div>
      </div>
    </div>
    <div class="af-cordas" id="afCordas"></div>
    <div class="af-tuning">
      <button onclick="mudaAfinacao(-1)">− ½</button>
      <span class="lbl" id="afTuningLbl">Padrão</span>
      <button onclick="mudaAfinacao(1)">+ ½</button>
    </div>
    <button class="af-cfg-btn" onclick="toggleAjustesAf()">⚙ ajustes</button>
    <div class="af-ajustes oculto" id="afAjustes">
      <div class="aj-row"><span>Tolerância</span>
        <button onclick="mudaTol(-1)">−</button><span class="aj-val" id="ajTol">±5 ¢</span><button onclick="mudaTol(1)">+</button></div>
      <div class="aj-row"><span>Sensibilidade</span>
        <button onclick="mudaSens(-1)">−</button><span class="aj-val" id="ajSens">3</span><button onclick="mudaSens(1)">+</button></div>
      <div class="aj-row"><span>Resposta</span>
        <button onclick="mudaResp(-1)">−</button><span class="aj-val" id="ajResp">3</span><button onclick="mudaResp(1)">+</button></div>
      <div class="aj-acoes">
        <button class="aj-salvar" id="ajSalvar" onclick="salvarAjustesAf()">💾 Salvar</button>
        <button onclick="restaurarAjustesAf()">↺ Padrão</button>
      </div>
    </div>
    <button class="af-start" id="afStart" onclick="ligarMic()">🎙️ Ativar microfone</button>
    <div class="af-status" id="afStatus"></div>
  </div>
</div>

<!-- ============ POPOVER: DIAGRAMA DE ACORDE ============ -->
<div class="acorde-overlay oculto" id="acPop" onclick="fecharAcorde()">
  <div class="acorde-card" onclick="event.stopPropagation()">
    <div class="acorde-nome" id="acNome"></div>
    <div id="acDiagrama"></div>
    <button class="acorde-var acorde-som" id="acOuvir" onclick="ouvirAcorde()">🔊 ouvir</button>
    <button class="acorde-var" id="acVar" onclick="variarAcorde()">variar acorde</button>
  </div>
</div>

<script>
/* ============================================================
   COMO ADICIONAR / EDITAR UMA MÚSICA
   ------------------------------------------------------------
   Cada música é um objeto na lista MUSICAS abaixo:
     { cat:"int" ou "nac", titulo:"", artista:"", tom:"", cifra:`...` }
   Na cifra, coloque o acorde ANTES da sílaba, entre colchetes:
       [G]Parabéns pra [D]você
   Linhas começando com "#" viram títulos (Intro, Refrão, etc).
   Linha em branco = espaço. É só isso.
   ============================================================ */
const MUSICAS = [
  /* ---------- INTERNACIONAL ---------- */
  { cat:"int", titulo:"Stand by Me", artista:"Ben E. King", tom:"G", cifra:`
#Intro: G  Em  C  D  G

#Primeira parte
When the [G]night has come
[Em]And the land is dark
And the [C]moon is the [D]only light [G]we'll see

#Pré-refrão
No, I [G]won't be afraid
No, I [Em]won't be afraid
Just as [C]long as you [D]stand, stand [G]by me

#Refrão
And, darling, darling [G]stand by me, oh now now
[Em]Stand by me
[C]Stand by me, [D]stand by [G]me

#Segunda parte
If the [G]sky that we look upon
[Em]Should tumble and fall
And the [C]mountains should [D]crumble to the [G]sea

I won't cry, I won't cry
No, I [Em]won't shed a tear
Just as [C]long as you [D]stand, stand [G]by me

#Refrão
And, darling, darling [G]stand by me, oh
[Em]Stand by me
[C]Stand by me, [D]stand by [G]me stand by me

#Solo: Em  C  D  G  |  Em  C  D  G

#Refrão final
Whenever you're in trouble won't you [G]stand by me?
Oh, now, now, [Em]stand by me
Oh, [C]stand by me, [D]stand by me, [G]stand by me

Darlin', darlin', stand by me
[Em]Stand by me
Oh, [C]stand by me, [D]stand by me, [G]stand by me
`},

  { cat:"int", titulo:"Take on Me", artista:"a-ha", tom:"G#m", cifra:`
#Primeira parte
We're [C#m]talking away [F#]
[B]I don't know what [E]I'm to [E/D#]say
I'll [C#m]say it anyway [F#]
[B]Today is another [E]day to [E/D#]find you
[C#m]Shying away [F#]
[G#m]I'll be coming for your [E]love, ok?

#Refrão
[B]Take [F#/A#]on [G#m]me [E](take on me)
[B]Take [F#/A#]me [G#m]on [E](take on me)

/* ===================== LISTA ===================== */
/* ----- estado da lista: ordem manual + favoritos (persistidos) ----- */
let ordem=null, favoritos=new Set();
try{ ordem=JSON.parse(localStorage.getItem('lista_ordem')||'null'); }catch(e){}
try{ favoritos=new Set(JSON.parse(localStorage.getItem('lista_fav')||'[]')); }catch(e){}
function salvarOrdem(){ localStorage.setItem('lista_ordem', JSON.stringify(ordem)); }
function salvarFav(){ localStorage.setItem('lista_fav', JSON.stringify([...favoritos])); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function listaOrdenada(){
  const titulos = MUSICAS.map(m=>m.titulo);
  if(!Array.isArray(ordem)) ordem = titulos.slice();
  ordem = ordem.filter(t=>titulos.includes(t));          // tira músicas removidas
  titulos.forEach(t=>{ if(!ordem.includes(t)) ordem.push(t); }); // acrescenta novas
  const by={}; MUSICAS.forEach(m=>by[m.titulo]=m);
  // favoritos sempre no topo, mantendo a ordem dentro de cada grupo (sort estável)
  const ord = ordem.slice().sort((a,b)=>(favoritos.has(b)?1:0)-(favoritos.has(a)?1:0));
  return ord.map(t=>by[t]);
}
function toggleFav(t){
  if(favoritos.has(t)) favoritos.delete(t); else favoritos.add(t);
  salvarFav(); montaLista();
}
function abrirPorTitulo(t){
  const i = MUSICAS.findIndex(m=>m.titulo===t);
  if(i>=0) abrir(i);
}

function montaLista(){
  const el = document.getElementById('lista');
  let html = `<div class="home-top"><h1>🎸 Minhas Cifras</h1>
    <button class="afinador-btn" onclick="abrirAfinador()">🎙️ Afinador</button></div>`;
  listaOrdenada().forEach(m=>{
    const fav = favoritos.has(m.titulo);
    const flag = m.cat==='nac' ? '🇧🇷' : '🌎';
    html += `<div class="item" data-titulo="${esc(m.titulo)}">
      <div class="item-info"><div class="t">${esc(m.titulo)}</div><div class="a">${esc(m.artista)}</div></div>
      <span class="flag" title="${m.cat==='nac'?'Nacional':'Internacional'}">${flag}</span>
      <button class="fav${fav?' on':''}" aria-label="Favoritar">${fav?'★':'☆'}</button>
    </div>`;
  });
  el.innerHTML = html;
  ativarLista(el);
}

/* ----- long-press para arrastar e reordenar (toque e mouse) ----- */
function ativarLista(lista){
  let alvo=null, lpTimer=null, dragMode=false, y0=0, arrastou=false, reordenou=false;
  const LONGPRESS=500, CANCEL=10;
  const ptY = e => e.touches ? e.touches[0].clientY : e.clientY;

  function reordenarPara(y){
    const itens=[...lista.querySelectorAll('.item:not(.arrastando)')];
    const depois = itens.find(it=>{ const r=it.getBoundingClientRect(); return y < r.top+r.height/2; }) || null;
    if(alvo.nextSibling!==depois){ lista.insertBefore(alvo, depois); reordenou=true; }
  }
  function onMove(e){
    const y=ptY(e);
    if(!dragMode){ if(Math.abs(y-y0)>CANCEL) clearTimeout(lpTimer); return; }
    e.preventDefault();          // segura o scroll da página durante o arraste
    reordenarPara(y);
  }
  function onUp(){
    if(alvo) alvo.classList.remove('arrastando');
    clearTimeout(lpTimer);
    document.removeEventListener('touchmove', onMove, {passive:false});
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchend', onUp);
    document.removeEventListener('mouseup', onUp);
    if(reordenou){
      ordem=[...lista.querySelectorAll('.item')].map(el=>el.dataset.titulo);
      salvarOrdem(); montaLista();   // normaliza (favoritos no topo)
    }
    alvo=null; dragMode=false;
  }
  function onDown(e){
    const it=e.target.closest('.item'); if(!it) return;
    if(e.target.closest('.fav')) return;            // estrela não inicia arraste
    alvo=it; y0=ptY(e); dragMode=false; arrastou=false; reordenou=false;
    lpTimer=setTimeout(()=>{
      dragMode=true; arrastou=true;
      it.classList.add('arrastando');
      if(navigator.vibrate) navigator.vibrate(15);
    }, LONGPRESS);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchend', onUp);
    document.addEventListener('mouseup', onUp);
  }

  lista.querySelectorAll('.item').forEach(it=>{
    it.addEventListener('touchstart', onDown, {passive:true});
    it.addEventListener('mousedown', onDown);
    it.addEventListener('click', e=>{
      if(e.target.closest('.fav')){ toggleFav(it.dataset.titulo); return; }
      if(arrastou) return;                          // não abrir logo após arrastar
      abrirPorTitulo(it.dataset.titulo);
    });
  });
}

/* ===================== CIFRA ===================== */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT={'Db':'C#','Eb':'D#','Fb':'E','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B'};
let atual=-1, deslocamento=0, fonte=18;

function transChord(ch,n){
  return ch.split('/').map(parte=>
    parte.replace(/^([A-G])(b|#)?/, (m,r,a)=>{
      let nome=r+(a||''); if(FLAT[nome]) nome=FLAT[nome];
      let i=SHARP.indexOf(nome); if(i<0) return m;
      return SHARP[(i+n+120)%12];
    })
  ).join('/');
}

/* ----- seletor de tom (popover no chip "Tom:") ----- */
const PC_GRID=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B']; // grafia exibida
const GRID_ORDEM=['A','Bb','B','C','Db','D','Eb','E','F','F#','G','Ab']; // ordem da grade
function pcDe(nome){ const m=(nome||'').match(/^([A-G])(b|#)?/); if(!m) return -1;
  let n=m[1]+(m[2]||''); if(FLAT[n]) n=FLAT[n]; return SHARP.indexOf(n); }
function partesTom(tom){ const m=(tom||'').match(/^([A-G](?:b|#)?)(.*)$/); return m?[m[1],m[2]]:['','']; }
function pcTomAtual(){ const m=MUSICAS[atual]; const [root]=partesTom(m.tom);
  return ((pcDe(root)+deslocamento)%12+12)%12; }

function nomeTomExibido(){
  const m=MUSICAS[atual]; if(!m.tom) return '';
  const [root,suf]=partesTom(m.tom);
  return deslocamento===0 ? m.tom : (PC_GRID[pcTomAtual()]+suf); // sem transpor = grafia original
}
function montaTomGrid(){
  document.getElementById('cTom').textContent = 'Tom: '+nomeTomExibido();
  const g=document.getElementById('tpGrid'); const pc=pcTomAtual();
  g.innerHTML = GRID_ORDEM.map(n=>
    `<button class="tp-note${pcDe(n)===pc?' on':''}" onclick="escolherTom('${n}')">${n}</button>`
  ).join('');
}
function escolherTom(nome){
  const [root]=partesTom(MUSICAS[atual].tom);
  deslocamento=((pcDe(nome)-pcDe(root))%12+12)%12;
  renderCorpo(); montaTomGrid();
}
function restaurarTom(){ deslocamento=0; renderCorpo(); montaTomGrid(); }
function restaurarOriginais(){ deslocamento=0; fonte=18; renderCorpo(); } // tom + fonte
function toggleTomPop(){
  const m=MUSICAS[atual]; if(!m||!m.tom) return;
  const p=document.getElementById('tomPop');
  if(p.classList.contains('oculto')){ montaTomGrid(); p.classList.remove('oculto'); }
  else p.classList.add('oculto');
}
function fecharTomPop(){ document.getElementById('tomPop').classList.add('oculto'); }

function renderLinha(linha){
  if(linha.trim()==='') return '<div class="linha vazia">&nbsp;</div>';
  if(linha.trim().startsWith('#'))
    return `<div class="secao-musica">${linha.replace(/^#\s?/,'')}</div>`;
  // tokeniza em segmentos {acorde, texto}
  let segs=[], buf='', ch=null, i=0;
  while(i<linha.length){
    if(linha[i]==='['){
      if(buf){segs.push({ch,t:buf}); buf=''; ch=null;}
      const f=linha.indexOf(']',i); ch=linha.slice(i+1,f); i=f+1;
    } else { buf+=linha[i]; i++; }
  }
  if(buf||ch) segs.push({ch,t:buf});
  // cada segmento vira palavras (acorde fica na 1ª palavra)
  let html='';
  segs.forEach(s=>{
    const acorde = s.ch!=null ? transChord(s.ch, deslocamento) : '';
    const partes = s.t.split(/(\s+)/);
    let primeira=true;
    for(let k=0; k<partes.length; k++){
      const p=partes[k];
      if(p==='') continue;
      if(/^\s+$/.test(p)){ // espaço solto (ex.: início do segmento)
        html+=`<span class="pal"><span class="ac"></span>${p.replace(/ /g,'&nbsp;')}</span>`; continue;
      }
      // anexa o espaço seguinte DENTRO da mesma palavra (flex come espaços soltos)
      let esp='';
      if(k+1<partes.length && /^\s+$/.test(partes[k+1])){ esp=partes[k+1]; k++; }
      const ac = (primeira && acorde) ? acorde : '';
      html+=`<span class="pal"><span class="ac">${ac}</span>${p}${esp}</span>`;
      primeira=false;
    }
    // acorde sem texto depois (ex.: fim de linha)
    if(acorde && partes.every(p=>/^\s*$/.test(p)))
      html+=`<span class="pal"><span class="ac">${acorde}</span>&nbsp;</span>`;
  });
  // linha só-de-acordes (instrumental): sem texto fora dos colchetes
  const soAcordes = linha.replace(/\[[^\]]*\]/g,'').trim()==='';
  return `<div class="linha${soAcordes?' acordes-only':''}">${html}</div>`;
}

function abrir(i){
  pararScroll(); atual=i; deslocamento=0;
  const m=MUSICAS[i];
  document.getElementById('cTitulo').textContent=m.titulo;
  document.getElementById('cArtista').textContent=m.artista;
  aplicaModo();   // aplica modo atual (cifra/letra/solo) + rótulo do botão
  document.getElementById('lista').style.display='none';
  document.getElementById('cifra').style.display='flex';
  document.getElementById('barra').style.display=m.cifra.trim()?'block':'none';
  carregarVel(m.titulo);   // velocidade salva desta música (ou padrão)
  carregarTabOffset(m.titulo);
  fecharPainel();          // sempre abre na vista principal
  fecharTomPop(); fecharAcorde();
  document.getElementById('cCorpo').scrollTop=0;
}
function renderCorpo(){
  const m=MUSICAS[atual];
  document.getElementById('cTom').textContent =
    m.tom ? 'Tom: '+nomeTomExibido() : '';
  const corpo=document.getElementById('cCorpo');
  corpo.classList.toggle('so-letra', modo==='letra');
  if(modo==='solo'){
    const bruto=(m.solos||'').replace(/^\n+|\n+$/g,'');
    if(!bruto){ corpo.innerHTML=`<div class="vazio">Sem solo cadastrado para esta música.</div>`; return; }
    const tab = tabOffset ? deslocaTab(bruto, tabOffset) : bruto;
    const sinal = tabOffset>0?'+'+tabOffset:tabOffset;
    corpo.innerHTML =
      `<div class="tab-ctrl">
         <button onclick="shiftTab(-1)">−</button>
         <span class="lbl">casas ${sinal}</span>
         <button onclick="shiftTab(1)">+</button>
         <button class="salvar" onclick="salvarTab()" id="btnSalvarTab">💾</button>
         <button onclick="resetTab()">↺</button>
       </div>
       <pre class="tab">${esc(tab)}</pre>`;
    return;
  }
  if(!m.cifra.trim()){
    corpo.innerHTML=`<div class="vazio">Cifra ainda não adicionada.<br><br>
      Abra o arquivo e cole no formato:<br>
      <code>[G]Parabéns pra [D]você</code></div>`;
    return;
  }
  corpo.innerHTML = m.cifra.replace(/\r/g,'').split('\n').map(renderLinha).join('');
  corpo.style.setProperty('--lyric-size', fonte+'px');
}
function voltar(){
  pararScroll();
  document.getElementById('cifra').style.display='none';
  document.getElementById('barra').style.display='none';
  document.getElementById('lista').style.display='block';
}
function transpor(n){ deslocamento+=n; renderCorpo(); }
function mudaFonte(n){ fonte=Math.max(12,Math.min(30,fonte+n)); renderCorpo(); }
let modo='cifra'; // 'cifra' | 'letra' | 'solo'
function ciclarModo(){
  modo = modo==='cifra' ? 'letra' : modo==='letra' ? 'solo' : 'cifra';
  aplicaModo();
}

  const b=document.getElementById('btnModo');
  b.textContent = modo==='cifra'?'Cifra':modo==='letra'?'Letra':'Solo';
  b.className = 'modo-btn'+(modo==='solo'?' modo-solo':'');
  renderCorpo();
}

/* ----- deslocamento das casas do tab (modo Solo), por música ----- */
let tabOffset=0;
// soma 'off' a cada número de casa que esteja em contexto de tab (após | ou -),
// compensando os tracinhos pra manter o alinhamento. Não toca em "(2x)" etc.
function deslocaTab(texto, off){
  return texto.split('\n').map(linha=>{
    const i1=linha.indexOf('|'); if(i1<0) return linha;   // não é linha de tab
    const i2=linha.lastIndexOf('|');
    const ini=linha.slice(0,i1+1);
    const fim=i2>i1?linha.slice(i2):'';                   // inclui "| (2x)" etc.
    const meio=linha.slice(i1+1, i2>i1?i2:linha.length)
      .replace(/(\d+)(-*)/g, (m,num,tracos)=>{            // desloca cada casa
        let v=parseInt(num)+off; if(v<0) v=0;
        const s=String(v);
        let pad=tracos.length + (num.length - s.length);  // compensa o alinhamento
        if(pad<0) pad=0;
        return s + '-'.repeat(pad);
      });
    return ini + meio + fim;
  }).join('\n');
}
function carregarTabOffset(titulo){
  const s=localStorage.getItem('tab:'+titulo);
  tabOffset = s!=null ? parseInt(s) : 0;
}
function shiftTab(n){ tabOffset+=n; renderCorpo(); }

/* ===================== ROLAGEM AUTOMÁTICA ===================== */
// Níveis em pixels/segundo. Os primeiros são bem mais lentos que o mínimo antigo
// (que era ~16 px/s). Nível exibido = índice + 1.
const VEL_PXS = [5, 8, 11, 15, 20, 27, 36, 48, 64, 85, 115, 150];
let velNivel = 4;        // padrão = nível 5 (20 px/s)
let rafId=null, lastTs=0, scrollAcc=0;

function mostraVel(){ document.getElementById('velNum').textContent = velNivel+1; }
function velScroll(n){
  velNivel = Math.max(0, Math.min(VEL_PXS.length-1, velNivel+n));
  mostraVel();
}
function carregarVel(titulo){
  const s = localStorage.getItem('vel:'+titulo);
  velNivel = (s!=null) ? Math.max(0, Math.min(VEL_PXS.length-1, parseInt(s))) : 4;
  mostraVel();
}
function salvarVel(){
  if(atual<0) return;
  localStorage.setItem('vel:'+MUSICAS[atual].titulo, velNivel);
  const b=document.getElementById('btnSalvarVel');
  b.textContent='✓';
  setTimeout(()=>{ b.textContent='💾'; }, 900);
}

function toggleScroll(){ rafId ? pararScroll() : iniciarScroll(); }
function iniciarScroll(){
  if(rafId) return;
  lastTs=0; scrollAcc=0;
  const b=document.getElementById('btnPlay');
  b.classList.add('on'); b.textContent='❚❚';
  const c=document.getElementById('cCorpo');
  const passo=(ts)=>{
    if(!lastTs) lastTs=ts;
    const dt=(ts-lastTs)/1000; lastTs=ts;
    scrollAcc += VEL_PXS[velNivel]*dt;
    if(scrollAcc>=1){ const px=Math.floor(scrollAcc); c.scrollTop+=px; scrollAcc-=px; }
    // parar ao chegar no fim
    if(c.scrollTop+c.clientHeight >= c.scrollHeight-1){ pararScroll(); return; }
    rafId=requestAnimationFrame(passo);
  };
  rafId=requestAnimationFrame(passo);
}
function pararScroll(){
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  const b=document.getElementById('btnPlay');
  if(b){ b.classList.remove('on'); b.textContent='▶'; }
}

/* ===================== AFINADOR (McLeod Pitch Method) ===================== */
// Cordas do violão (afinação padrão) — nota MIDI e rótulo.
const CORDAS=[
  {midi:40, nome:'E'}, {midi:45, nome:'A'}, {midi:50, nome:'D'},
  {midi:55, nome:'G'}, {midi:59, nome:'B'}, {midi:64, nome:'e'}
];
const NOMES_NOTA=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let afCtx=null, afAnalyser=null, afStream=null, afBuf=null, afRaf=null, afUltimo=0;
let afTuning=0;      // afinação: semitons aplicados a todas as cordas (0 = padrão)
let afCordaSel=-1;   // -1 = automático; 0..5 = corda travada
let afHold=0;        // timestamp da última detecção válida (segura o display)
// ajustes editáveis (com save)
let afTol=5, afSens=3, afResp=3;   // tolerância(¢), sensibilidade(1-5), resposta(1-5)
function afGate(){ return [0.012,0.009,0.006,0.004,0.0025][afSens-1]; }   // gate de silêncio
function afClareza(){ return [0.50,0.45,0.38,0.33,0.28][afSens-1]; }      // limiar NSDF
function afThrottleMs(){ return [90,65,45,32,22][afResp-1]; }             // ms entre análises
const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
function montaAjustesAf(){
  document.getElementById('ajTol').textContent='±'+afTol+' ¢';
  document.getElementById('ajSens').textContent=afSens;
  document.getElementById('ajResp').textContent=afResp;
}
function mudaTol(n){ afTol=clampN(afTol+n,1,20); montaAjustesAf(); }
function mudaSens(n){ afSens=clampN(afSens+n,1,5); montaAjustesAf(); }
function mudaResp(n){ afResp=clampN(afResp+n,1,5); montaAjustesAf(); }
function toggleAjustesAf(){ document.getElementById('afAjustes').classList.toggle('oculto'); }
function carregarAjustesAf(){
  try{ const s=JSON.parse(localStorage.getItem('afinador_cfg')||'null');
    if(s){ afTol=s.tol??5; afSens=s.sens??3; afResp=s.resp??3; } }catch(e){}
  montaAjustesAf();
}
function salvarAjustesAf(){
  localStorage.setItem('afinador_cfg', JSON.stringify({tol:afTol,sens:afSens,resp:afResp}));
  const b=document.getElementById('ajSalvar'); b.textContent='✓ Salvo';
  setTimeout(()=>{ b.textContent='💾 Salvar'; }, 1000);
}
function restaurarAjustesAf(){ afTol=5; afSens=3; afResp=3; montaAjustesAf(); }

function nomeCordaTunada(i){ return NOMES_NOTA[((CORDAS[i].midi+afTuning)%12+12)%12]; }
function fmtAfinacao(){
  if(afTuning===0) return 'Padrão (E A D G B E)';
  const nome6 = NOMES_NOTA[((40+afTuning)%12+12)%12];
  const n=Math.abs(afTuning);
  return (afTuning>0?'+':'−')+n+' semitom'+(n>1?'s':'')+' ('+nome6+')';
}
function selCorda(i){ afCordaSel = (afCordaSel===i)?-1:i; montaCordas(); }
function mudaAfinacao(n){ afTuning=Math.max(-12,Math.min(12,afTuning+n)); montaCordas(); }

function abrirAfinador(){
  pararScroll();
  document.getElementById('lista').style.display='none';
  document.getElementById('cifra').style.display='none';
  document.getElementById('afinador').style.display='flex';
  carregarAjustesAf();
  montaCordas();
  resetAfinadorUI();
}
function voltarDoAfinador(){
  pararMic();
  document.getElementById('afinador').style.display='none';
  document.getElementById('lista').style.display='block';
}
function montaCordas(){
  document.getElementById('afCordas').innerHTML =
    CORDAS.map((c,i)=>`<div class="af-corda${i===afCordaSel?' sel':''}" data-i="${i}" onclick="selCorda(${i})">${nomeCordaTunada(i)}</div>`).join('');
  document.getElementById('afTuningLbl').textContent = fmtAfinacao();
}
function resetAfinadorUI(){
  document.getElementById('afNota').textContent='–';
  document.getElementById('afNota').className='af-nota';
  document.getElementById('afDir').textContent=''; document.getElementById('afDir').className='af-dir';
  document.getElementById('afHz').innerHTML='&nbsp;';
  document.getElementById('afNeedle').style.left='50%';
  document.getElementById('afNeedle').classList.remove('afinado');
  document.querySelectorAll('.af-corda').forEach(e=>{ e.classList.remove('ativa','afinado'); });
}

async function ligarMic(){
  const status=document.getElementById('afStatus');
  if(afStream){ pararMic(); document.getElementById('afStart').textContent='🎙️ Ativar microfone'; status.textContent=''; return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent='Microfone indisponível aqui: precisa de HTTPS. No celular funciona quando virar PWA; no Mac, abra via http://localhost:8000.';
    return;
  }
  status.textContent='Pedindo acesso ao microfone…';
  try{
    afStream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
  }catch(e){
    status.textContent='Microfone negado. Libere o acesso nos ajustes do navegador.';
    return;
  }
  afCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(afCtx.state==='suspended') await afCtx.resume();
  const src = afCtx.createMediaStreamSource(afStream);
  afAnalyser = afCtx.createAnalyser();
  afAnalyser.fftSize = 4096;
  src.connect(afAnalyser);
  afBuf = new Float32Array(afAnalyser.fftSize);
  document.getElementById('afStart').textContent='⏹ Parar';
  status.textContent='Toque uma corda…';
  loopAfinador();
}
function pararMic(){
  if(afRaf) cancelAnimationFrame(afRaf), afRaf=null;
  if(afStream){ afStream.getTracks().forEach(t=>t.stop()); afStream=null; }
  if(afCtx){ afCtx.close(); afCtx=null; }
  afAnalyser=null;
  const s=document.getElementById('afStart'); if(s) s.textContent='🎙️ Ativar microfone';
  resetAfinadorUI();
}

function loopAfinador(){
  afRaf=requestAnimationFrame(loopAfinador);
  const agora=performance.now();
  if(agora-afUltimo < afThrottleMs()) return;   // intervalo ajustável (Resposta)
  afUltimo=agora;
  afAnalyser.getFloatTimeDomainData(afBuf);
  const f = detectarFreqMPM(afBuf, afCtx.sampleRate);
  atualizaAfinador(f);
}

// McLeod Pitch Method: NSDF + escolha do 1º pico relevante + interpolação parabólica
function detectarFreqMPM(buf, sr){
  const N=buf.length;
  let rms=0; for(let i=0;i<N;i++) rms+=buf[i]*buf[i];
  if(Math.sqrt(rms/N) < afGate()) return -1;  // gate de silêncio (ajustável)
  const minLag=Math.max(2, Math.floor(sr/1100));   // até ~1100 Hz
  const maxLag=Math.min(N-2, Math.floor(sr/55));   // até ~55 Hz (cobre afinações graves)
  const nsdf=new Float32Array(maxLag+1);
  let maxVal=0;
  for(let tau=minLag; tau<=maxLag; tau++){
    let ac=0, m=0;
    for(let i=0;i<N-tau;i++){ ac+=buf[i]*buf[i+tau]; m+=buf[i]*buf[i]+buf[i+tau]*buf[i+tau]; }
    const v = m>0 ? 2*ac/m : 0;
    nsdf[tau]=v; if(v>maxVal) maxVal=v;
  }
  if(maxVal < afClareza()) return -1;          // sem periodicidade clara (ajustável)
  const limite = 0.8*maxVal;                   // 1º pico que passa de 80% do máximo
  let pico=-1;
  for(let tau=minLag+1; tau<maxLag; tau++){
    if(nsdf[tau]>nsdf[tau-1] && nsdf[tau]>=nsdf[tau+1] && nsdf[tau]>limite){ pico=tau; break; }
  }
  if(pico<0) return -1;
  const x1=nsdf[pico-1], x2=nsdf[pico], x3=nsdf[pico+1];
  const den=(x1-2*x2+x3);
  const off = den!==0 ? 0.5*(x1-x3)/den : 0;
  return sr/(pico+off);
}

function atualizaAfinador(f){
  const nota=document.getElementById('afNota');
  const dir=document.getElementById('afDir');
  const hz=document.getElementById('afHz');
  const needle=document.getElementById('afNeedle');
  const agora=performance.now();
  if(f>0){ afHold=agora; }
  else if(agora-afHold > 350){          // sem som por um tempo: zera o display
    dir.textContent=''; dir.className='af-dir';
    nota.className='af-nota'; needle.classList.remove('afinado');
    document.querySelectorAll('.af-corda').forEach(e=>e.classList.remove('ativa','afinado'));
    return;
  } else return;                        // dropout curto: segura a última leitura
  const midi = 69 + 12*Math.log2(f/440);
  let nn, cents;
  if(afCordaSel>=0){                     // corda travada: desvio em relação ao alvo dela
    nn = CORDAS[afCordaSel].midi + afTuning;
    const alvo = 440*Math.pow(2,(nn-69)/12);
    cents = 1200*Math.log2(f/alvo);
    while(cents>600) cents-=1200; while(cents<-600) cents+=1200;  // oitava mais próxima
  }else{                                 // automático: nota cromática mais próxima
    nn = Math.round(midi);
    cents = (midi-nn)*100;
  }
  cents = Math.round(cents);
  nota.textContent = NOMES_NOTA[((nn%12)+12)%12];
  hz.textContent = f.toFixed(1)+' Hz · '+(cents>0?'+':'')+cents+' ¢';
  needle.style.left = (50+Math.max(-50,Math.min(50,cents)))+'%';
  const afinado = Math.abs(cents)<=afTol;
  needle.classList.toggle('afinado', afinado);
  if(afinado){ dir.textContent='✓ afinado'; dir.className='af-dir ok'; nota.className='af-nota afinado'; }
  else if(cents<0){ dir.textContent='↑ aperte'; dir.className='af-dir baixo'; nota.className='af-nota'; }
  else{ dir.textContent='afrouxe ↓'; dir.className='af-dir alto'; nota.className='af-nota'; }
  // destaca a corda: travada = a selecionada; automático = a que casa com a nota
  document.querySelectorAll('.af-corda').forEach(e=>{
    const i=+e.dataset.i;
    const casa = afCordaSel>=0 ? (i===afCordaSel) : ((CORDAS[i].midi+afTuning)===nn);
    e.classList.toggle('ativa', casa && afCordaSel<0);
    e.classList.toggle('afinado', casa && afinado);
  });
}

/* ===================== DIAGRAMA DE ACORDE ===================== */
// Formas móveis (pestana). Cada string low→high (Mi6,Lá5,Ré4,Sol3,Si2,mi1).
// 0 = casa da pestana (raiz), 'x' = abafada. Vira acorde aberto quando a raiz é casa 0.
const FORMAS = {
  '':      { E:[0,2,2,1,0,0], A:['x',0,2,2,2,0] },   // maior
  'm':     { E:[0,2,2,0,0,0], A:['x',0,2,2,1,0] },   // menor
  '7':     { E:[0,2,0,1,0,0], A:['x',0,2,0,2,0] },
  'm7':    { E:[0,2,0,0,0,0], A:['x',0,2,0,1,0] },
  'maj7':  { E:[0,2,1,1,0,0], A:['x',0,2,1,2,0] },
  'sus4':  { E:[0,2,2,2,0,0], A:['x',0,2,2,3,0] },
  '7sus4': { E:[0,2,0,2,0,0], A:['x',0,2,0,3,0] },   // 7(4)
  '7(4/9)':{ A:['x',0,0,0,0,0] },                    // 9sus4: pestana inteira (ex.: E7(4/9)=x77777)
  'sus2':  { A:['x',0,2,2,0,0] },
  '6':     { E:[0,2,2,1,2,0], A:['x',0,2,2,2,2] },
  'dim':   { A:['x',0,1,2,1,'x'] }
};
function fretRaiz(pc, ref){ const aberto = ref==='E'?4:9; return ((pc-aberto)%12+12)%12; }
function qualidadeDe(suf){
  suf=(suf||'').trim();
  if(suf==='') return '';
  if(/^(maj7|7M|M7|7\+|\+)/.test(suf)) return 'maj7';
  if(/^m(?!aj)/.test(suf)) return /7/.test(suf) ? 'm7' : 'm';
  if(/^7.*4.*9|^9sus4|^7\(4\/9\)/.test(suf)) return '7(4/9)';   // 7(4/9), 9sus4
  if(/^7.*(sus4|\(4\)|4)/.test(suf)) return '7sus4';            // 7(4), 7sus4
  if(/^7/.test(suf)) return '7';
  if(/^(sus4|4)/.test(suf)) return 'sus4';                      // 4, 4(9)
  if(/^(sus2|2)/.test(suf)) return 'sus2';
  if(/^6/.test(suf)) return '6';
  if(/^(dim|°|o)/.test(suf)) return 'dim';
  return ''; // 9, add9, etc. caem na tríade maior
}
function parseAcorde(nome){
  const m=(nome||'').match(/^([A-G](?:b|#)?)(.*)$/); if(!m) return null;
  let suf=m[2], bass=null; const sl=suf.indexOf('/');
  // só é baixo invertido se depois da "/" vier uma NOTA (evita quebrar 7(4/9))
  if(sl>=0 && /^[A-G](b|#)?$/.test(suf.slice(sl+1))){
    bass=suf.slice(sl+1); suf=suf.slice(0,sl);
  }
  return {root:m[1], suf, bass, pc:pcDe(m[1])};
}
function voicingsDe(nome){
  const p=parseAcorde(nome); if(!p||p.pc<0) return [];
  const formas=FORMAS[qualidadeDe(p.suf)]||FORMAS[''];
  const out=[];
  ['E','A'].forEach(ref=>{
    const shape=formas[ref]; if(!shape) return;
    const barre=fretRaiz(p.pc, ref);
    out.push(shape.map(o=> o==='x'?null : barre+o));
  });
  return out;
}
function svgAcorde(frets){
  const W=140,H=168,L=20,R=14,T=30,B=16, nS=6,nF=5;
  const gw=W-L-R, gh=H-T-B, sx=gw/(nS-1), fy=gh/nF;
  const pos=frets.filter(f=>f>0);
  const startFret = (!pos.length || Math.max(...pos)<=4) ? 1 : Math.min(...pos);
  let s='';
  for(let i=0;i<=nF;i++){ const y=T+i*fy;
    s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#7d8794" stroke-width="${(i===0&&startFret===1)?3:1}"/>`; }
  for(let i=0;i<nS;i++){ const x=L+i*sx;
    s+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="#7d8794" stroke-width="1"/>`; }
  if(startFret>1) s+=`<text x="${L-7}" y="${T+fy*0.72}" fill="#8a93a0" font-size="12" text-anchor="end">${startFret}ª</text>`;
  // pestana: menor casa positiva cobrindo da 1ª à última corda tocada (span >= 4)
  let barreF=-1, bIni=-1, bFim=-1;
  if(pos.length){
    const f=Math.min(...pos);
    const tocadas=frets.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
    const comF=frets.map((v,i)=>v===f?i:-1).filter(i=>i>=0);
    const lo=Math.min(...tocadas), hi=Math.max(...tocadas);
    if(comF.length>=2 && comF.includes(lo) && comF.includes(hi) && (hi-lo+1)>=4){
      barreF=f; bIni=lo; bFim=hi;
    }
  }
  if(barreF>0){
    const y=T+((barreF-startFret)+0.5)*fy;
    s+=`<rect x="${L+bIni*sx-7}" y="${y-6.5}" width="${(bFim-bIni)*sx+14}" height="13" rx="6.5" fill="#ffcc55"/>`;
  }
  frets.forEach((f,i)=>{ const x=L+i*sx;
    if(f===null){ s+=`<text x="${x}" y="${T-9}" fill="#8a93a0" font-size="14" text-anchor="middle">×</text>`; }
    else if(f===0){ s+=`<circle cx="${x}" cy="${T-13}" r="4.5" fill="none" stroke="#e7ebf0" stroke-width="1.5"/>`; }
    else if(f===barreF && i>=bIni && i<=bFim){ /* coberto pela pestana */ }
    else { const y=T+((f-startFret)+0.5)*fy; s+=`<circle cx="${x}" cy="${y}" r="6.5" fill="#ffcc55"/>`; }
  });
  return `<svg class="acorde-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
let acVoicings=[], acIndex=0;
function abrirAcorde(nome){
  acVoicings=voicingsDe(nome); acIndex=0;
  if(!acVoicings.length) return;
  document.getElementById('acNome').textContent=nome;
  document.getElementById('acVar').style.display = acVoicings.length>1?'block':'none';
  renderAcordeDiagrama();
  document.getElementById('acPop').classList.remove('oculto');
}
function renderAcordeDiagrama(){
  document.getElementById('acDiagrama').innerHTML = svgAcorde(acVoicings[acIndex]);
}
function variarAcorde(){ acIndex=(acIndex+1)%acVoicings.length; renderAcordeDiagrama(); }
function fecharAcorde(){ document.getElementById('acPop').classList.add('oculto'); }

/* ----- tocar o acorde (síntese Web Audio, dedilhado) ----- */
const AFINACAO_MIDI=[40,45,50,55,59,64]; // E A D G B e
let somCtx=null;
function ouvirAcorde(){
  const v=acVoicings[acIndex]; if(!v) return;
  if(!somCtx) somCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(somCtx.state==='suspended') somCtx.resume();
  const t0=somCtx.currentTime+0.03;
  const notas=v.map((f,i)=>f===null?null:AFINACAO_MIDI[i]+f).filter(n=>n!==null);
  notas.forEach((midi,k)=>{
    const freq=440*Math.pow(2,(midi-69)/12);
    const t=t0+k*0.055;                      // dedilhado (strum)
    const osc=somCtx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
    const osc2=somCtx.createOscillator(); osc2.type='sine'; osc2.frequency.value=freq*2;
    const g=somCtx.createGain(), g2=somCtx.createGain();
    const lp=somCtx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(3200,t); lp.frequency.exponentialRampToValueAtTime(900,t+1.4);
    g.gain.setValueAtTime(0.0001,t);  g.gain.exponentialRampToValueAtTime(0.16,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    g2.gain.setValueAtTime(0.0001,t); g2.gain.exponentialRampToValueAtTime(0.05,t+0.008);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    osc.connect(g).connect(lp); osc2.connect(g2).connect(lp); lp.connect(somCtx.destination);
    osc.start(t); osc.stop(t+1.7); osc2.start(t); osc2.stop(t+1.0);
  });
}
// clique em qualquer acorde (.ac) abre o diagrama
document.getElementById('cCorpo').addEventListener('click', e=>{
  const ac=e.target.closest('.ac'); if(!ac) return;
  const nome=ac.textContent.trim(); if(nome) abrirAcorde(nome);
});
